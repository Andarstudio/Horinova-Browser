name: Build Horinova

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish a GitHub Release on tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Horinova.csproj -r win-x64

      - name: Publish app (self-contained, win-x64)
        run: dotnet publish Horinova.csproj -c Release -r win-x64 --self-contained true --no-restore -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Horinova.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Horinova-Setup
          path: installer-output/Horinova-Setup.exe

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Horinova-win-x64
          path: publish

      # Runs only when you push a tag like v1.0.0
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/Horinova-Setup.exe
          
